<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remind Me Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 329px;
      background: #ffffff;
      border: 1px solid #b3b3b3;
      border-radius: 10px;
      padding: 16px 16px 22px;
    }

    .card__close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      color: #000000;
    }

    .card__close svg {
      width: 11px;
      height: 11px;
    }

    .card__title {
      font-size: 15px;
      font-weight: 500;
      line-height: 21px;
      color: #000000;
      padding-right: 48px;
    }

    .card__text {
      margin-top: 18px;
      font-size: 12.5px;
      font-weight: 400;
      line-height: 18px;
      color: #000000;
    }

    .card__button {
      display: block;
      width: 100%;
      height: 34px;
      margin-top: 24px;
      background: #ec027f;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .card__button:hover {
      background: #d10071;
    }
  </style>
</head>
<body>
  <div class="card">
    <button class="card__close" type="button" aria-label="Close">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <line x1="1" y1="1" x2="11" y2="11" />
        <line x1="11" y1="1" x2="1" y2="11" />
      </svg>
    </button>

    <h2 class="card__title">BLACKOUT HOUR drops today at 10:00AM</h2>

    <p class="card__text">
      Get an instant Live Activity countdown on your lock screen with real-time stock claim tracking
    </p>

    <button class="card__button" type="button">Remind Me</button>
  </div>
</body>
</html>

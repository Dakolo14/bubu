<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hybrid Homepage Prototype</title>
<style>
:root{
  --bg:#fff; --surface:#f6f6f3; --fill:#ececE8; --fill2:#dededa; --fill3:#c4c4bd;
  --line:#e6e6e1; --line2:#d2d2cc; --ink:#1c1c1a; --ink2:#4a4a46; --muted:#8a8a84;
  --accent:#ff4b33; --accent-ink:#fff;
  --rail:72px; --railx:252px; --crail:320px; --hh:68px; --r:16px;
  --shadow:0 18px 50px -18px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block;flex:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.grow{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}

/* ---------- buttons & primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:13px;font-weight:600;white-space:nowrap;transition:background .12s,border-color .12s,transform .08s}
.btn:hover{background:var(--surface)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface)}
.btn.sm{height:30px;padding:0 12px;font-size:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.follow.on{background:var(--fill);border-color:var(--fill);color:var(--ink)}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:#fff;color:var(--ink2);position:relative;flex:none}
.ibtn:hover{background:var(--surface);color:var(--ink)}
.ibtn.bare{border-color:transparent;background:transparent}
.ibtn.bare:hover{background:var(--fill)}
.ibtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ibtn .dotn{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;background:var(--fill);border:0;font-size:13px;color:var(--ink2);white-space:nowrap}
.chip:hover{background:var(--fill2)}
.chip.on{background:var(--ink);color:#fff}
.chip.sm{height:26px;padding:0 10px;font-size:12px}
.av{display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border-radius:50%;background:var(--fill2);color:var(--ink2);font-size:10px;font-weight:700;letter-spacing:.02em;overflow:hidden}
.av.s20{width:20px;height:20px;font-size:8.5px}.av.s36{width:36px;height:36px;font-size:12px}.av.s44{width:44px;height:44px;font-size:14px}.av.s56{width:56px;height:56px;font-size:17px}.av.s96{width:96px;height:96px;font-size:28px;border:4px solid #fff}
.ph{position:relative;background:
  linear-gradient(to top right,transparent calc(50% - .6px),rgba(0,0,0,.09) 50%,transparent calc(50% + .6px)),
  linear-gradient(to top left,transparent calc(50% - .6px),rgba(0,0,0,.09) 50%,transparent calc(50% + .6px)),
  var(--fill)}
.t0{background-color:#ececE8}.t1{background-color:#e5e5e0}.t2{background-color:#efefeb}.t3{background-color:#dfdfda}
.label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lnk{border:0;background:none;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border:1px solid var(--line2);border-radius:5px;font-size:11px;color:var(--muted);background:#fff}
input[type=text],input[type=search],textarea,select{width:100%;border:1px solid var(--line2);border-radius:12px;background:#fff;padding:10px 12px;font-size:14px;outline:none}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--ink)}
textarea{resize:vertical;min-height:84px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:12px;font-weight:600;color:var(--ink2);display:flex;justify-content:space-between}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;font-size:13px;cursor:pointer}
.check input{margin-top:2px;accent-color:var(--ink);width:16px;height:16px}
.switch{position:relative;width:40px;height:24px;flex:none;border-radius:12px;background:var(--fill2);border:0;padding:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch.on{background:var(--ink)}
.switch.on::after{transform:translateX(16px)}

/* ---------- rail ---------- */
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail);background:#fff;border-right:1px solid var(--line);z-index:60;display:flex;flex-direction:column;padding:14px 12px;overflow:hidden;transition:width .18s ease,box-shadow .18s ease}
.rail:hover{width:var(--railx);box-shadow:10px 0 40px -16px rgba(0,0,0,.22);transition-delay:.15s}
.app.pinned .rail{width:var(--railx);box-shadow:none;transition-delay:0s}
.rail-top{display:flex;align-items:center;gap:8px;height:40px;margin-bottom:14px}
.logo{display:flex;align-items:center;justify-content:center;height:36px;width:48px;flex:none;border:1.5px dashed var(--fill3);border-radius:10px;font-weight:800;font-size:9.5px;letter-spacing:.12em;color:var(--ink2);background:#fff}
.logo:hover{border-color:var(--ink2)}
.pinbtn{margin-left:auto;opacity:0;transition:opacity .12s}
.rail:hover .pinbtn,.app.pinned .pinbtn{opacity:1}
.ri{display:flex;align-items:center;gap:14px;height:46px;padding:0 14px;border-radius:12px;border:0;background:none;color:var(--ink2);width:100%;white-space:nowrap;position:relative;font-size:14px;font-weight:500;text-align:left;flex:none}
.ri:hover{background:var(--surface);color:var(--ink)}
.ri.on{background:var(--ink);color:#fff}
.ri .lbl{opacity:0;transition:opacity .12s}
.rail:hover .lbl,.app.pinned .lbl{opacity:1;transition-delay:.12s}
.app.pinned .lbl{transition-delay:0s}
.ri .bdg{position:absolute;left:30px;top:7px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.ri.on .bdg{border-color:var(--ink)}
.rsep{height:1px;background:var(--line);margin:10px 6px;flex:none}
.rcolls{opacity:0;pointer-events:none;transition:opacity .12s;overflow:hidden;min-height:0;display:flex;flex-direction:column}
.rail:hover .rcolls,.app.pinned .rcolls{opacity:1;pointer-events:auto;transition-delay:.12s}
.rcolls .label{padding:6px 14px 6px}
.rc{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;border:0;background:none;width:100%;text-align:left;white-space:nowrap;font-size:13px;color:var(--ink2)}
.rc:hover{background:var(--surface)}
.rc .ph{width:30px;height:30px;border-radius:8px;flex:none}
.rc .n{margin-left:auto;font-size:11px;color:var(--muted)}
.rail-bot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:8px}
.ri.me{padding:0 10px;gap:12px}
.ri.me .av{width:28px;height:28px}

/* ---------- main & header ---------- */
.main{margin-left:var(--rail);min-height:100vh;transition:margin .18s ease}
.app.pinned .main{margin-left:var(--railx)}
.top{position:sticky;top:0;z-index:40;height:var(--hh);display:flex;align-items:center;gap:12px;padding:0 24px;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.swrap{position:relative;flex:1;max-width:1100px}
.search{display:flex;align-items:center;gap:8px;height:46px;border-radius:999px;background:var(--fill);padding:0 6px 0 16px;color:var(--muted);border:1.5px solid transparent;transition:border-color .12s,background .12s}
.swrap.open .search,.search:focus-within{background:#fff;border-color:var(--ink)}
.search input{flex:1;border:0;background:transparent;outline:none;padding:0;height:100%;font-size:14px;color:var(--ink);min-width:0}
.search .clr{display:none}
.search.has .clr{display:inline-flex}
.scope{display:flex;align-items:center;gap:4px;height:32px;padding:0 10px 0 12px;border:0;border-left:1px solid var(--line2);background:none;color:var(--ink2);font-size:13px;font-weight:500;white-space:nowrap}
.sdrop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:none;z-index:45;max-height:min(70vh,560px);overflow:auto}
.swrap.open .sdrop{display:block}
.sgroup+.sgroup{margin-top:18px}
.sgroup .label{margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.sopt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;border:0;background:none;text-align:left;font-size:14px}
.sopt:hover,.sopt.hl{background:var(--surface)}
.sopt .sub{margin-left:auto;font-size:12px;color:var(--muted)}
.sopt .ph{width:36px;height:36px;border-radius:8px;flex:none}
.sopt mark{background:none;font-weight:700;color:var(--ink)}
.recent{display:flex;flex-wrap:wrap;gap:8px}
.recent .chip{padding-right:6px}
.recent .chip .x{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;color:var(--muted)}
.recent .chip .x:hover{background:var(--fill3);color:var(--ink)}
.up-lbl{display:inline}
.upbtn{height:46px;padding:0 20px}

/* ---------- views ---------- */
.wrap{padding:0 24px 80px}
.greet{padding:20px 0 2px;font-size:13px;color:var(--muted)}
.greet b{color:var(--ink)}
.vh{padding:28px 0 6px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.vh h1{margin:0;font-size:28px;letter-spacing:-.025em;line-height:1.15}
.vh p{margin:4px 0 0;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;color:var(--ink2);font-weight:500;margin-top:20px}
.back:hover{color:var(--ink)}

/* rings */
.rings-wrap{position:relative}
.rings{display:flex;gap:16px;overflow-x:auto;padding:14px 4px 8px;scrollbar-width:none;scroll-behavior:smooth}
.rings::-webkit-scrollbar{display:none}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;font-size:12px;color:var(--ink2);flex:none;width:74px}
.ring .o{width:68px;height:68px;border-radius:50%;padding:3px;border:2px solid var(--line2);position:relative;transition:transform .12s}
.ring:hover .o{transform:scale(1.05)}
.ring.new .o{border-color:var(--ink2)}
.ring.new .o::after{content:"";position:absolute;top:1px;right:1px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff}
.ring.on .o{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.ring.on{color:var(--ink);font-weight:700}
.ring .o .ph{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--ink2);letter-spacing:.04em}
.ring.add .o{border-style:dashed;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.rarrow{position:absolute;top:34px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px -4px rgba(0,0,0,.2);z-index:2}
.rarrow.l{left:-8px}.rarrow.r{right:-8px}
.rings-wrap.cl .rarrow.l,.rings-wrap.cr .rarrow.r{display:flex}

/* feed bar */
.fbar{position:sticky;top:var(--hh);z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:10px 0;margin-bottom:6px;border-bottom:1px solid transparent;transition:border-color .15s}
.fbar.stuck{border-bottom-color:var(--line)}
.tabs{display:flex;gap:22px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:8px 0;font-size:15px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink2)}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--fill);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:none;padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--ink2);display:flex;gap:5px;align-items:center}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.ctx{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.ctx .chip{height:28px;font-size:12px}

/* masonry & cards */
.mas{display:flex;gap:16px;align-items:flex-start}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:22px}
.card{container-type:inline-size;animation:cardIn .35s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}}
.media{position:relative;border-radius:var(--r);overflow:hidden;cursor:zoom-in;outline-offset:3px}
.media>img,.media>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.media.motion{background:
  linear-gradient(to top right,transparent calc(50% - .6px),rgba(0,0,0,.1) 50%,transparent calc(50% + .6px)),
  linear-gradient(to top left,transparent calc(50% - .6px),rgba(0,0,0,.1) 50%,transparent calc(50% + .6px)),#d6d6d0}
.blob{position:absolute;width:30%;aspect-ratio:1;border-radius:50%;background:#bdbdb6;left:12%;top:22%;animation:drift 6s ease-in-out infinite;animation-play-state:paused}
.blob.b2{width:18%;background:#a9a9a2;left:62%;top:58%;border-radius:30%;animation:drift2 6s ease-in-out infinite;animation-play-state:paused}
@keyframes drift{0%{transform:translate(0,0) scale(1)}25%{transform:translate(120%,30%) scale(.8)}50%{transform:translate(150%,140%) scale(1.15)}75%{transform:translate(20%,120%) scale(.9)}100%{transform:translate(0,0) scale(1)}}
@keyframes drift2{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(-220%,-180%) rotate(180deg)}100%{transform:translate(0,0) rotate(360deg)}}
.playing .blob{animation-play-state:running}
.badge{position:absolute;top:10px;left:10px;z-index:2;background:rgba(28,28,26,.8);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:4px 8px 4px 7px;border-radius:20px;display:flex;gap:5px;align-items:center;pointer-events:none}
.count{position:absolute;top:10px;left:10px;z-index:2;background:rgba(255,255,255,.94);font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:20px;display:flex;gap:4px;align-items:center;pointer-events:none}
.prog{position:absolute;left:12px;right:12px;bottom:10px;height:3px;background:rgba(255,255,255,.6);border-radius:2px;overflow:hidden;z-index:2;opacity:0;transition:opacity .2s;pointer-events:none}
.prog i{display:block;height:100%;width:0;background:var(--ink);animation:prog 6s linear infinite;animation-play-state:paused}
.playing .prog{opacity:1}
.playing .prog i{animation-play-state:running}
@keyframes prog{to{width:100%}}
.ppbig{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:1;pointer-events:none}
.ppbig span{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px -4px rgba(0,0,0,.3)}
body.noauto .media.motion:not(.playing) .ppbig{display:flex}
.stag{position:absolute;top:10px;right:10px;z-index:2;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:none;align-items:center;justify-content:center;pointer-events:none}
.card.saved .stag{display:flex}
.hov{position:absolute;inset:0;z-index:3;opacity:0;background:linear-gradient(rgba(20,20,18,.42),rgba(20,20,18,.18) 45%,rgba(20,20,18,.55));transition:opacity .15s;display:flex;flex-direction:column;justify-content:space-between;padding:10px}
.media:hover .hov,.media:focus-visible .hov,.media.pop-open .hov{opacity:1}
.media:hover .stag,.media:hover .badge,.media:hover .count,.media.pop-open .badge,.media.pop-open .count{display:none}
.hov-top{display:flex;align-items:center;gap:6px}
.hov-bot{display:flex;align-items:center;gap:6px;color:#fff}
.hov-bot .t{font-size:13px;font-weight:600;line-height:1.25;text-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hic{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none}
.hic:hover{background:#fff;transform:scale(1.06)}
.hic.on{color:var(--accent)}
.hic.on svg path{fill:currentColor}
.savegrp{display:flex;align-items:center;gap:6px;margin-left:auto;min-width:0}
.scoll{display:flex;align-items:center;gap:3px;height:34px;padding:0 8px 0 12px;border:0;border-radius:999px;background:rgba(255,255,255,.95);font-size:12.5px;font-weight:600;max-width:140px;min-width:0}
.scoll span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbtn{height:34px;padding:0 15px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;flex:none}
.sbtn:hover{filter:brightness(.94)}
.savegrp.on .sbtn{background:var(--ink)}
@container (max-width:210px){.scoll{display:none}}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 2px 0}
.who{display:flex;gap:8px;align-items:center;background:none;border:0;padding:0;min-width:0}
.who .nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who:hover .nm{text-decoration:underline;text-underline-offset:2px}
.likes{border:0;background:none;color:var(--muted);font-size:12px;display:flex;gap:3px;align-items:center;padding:2px 4px;border-radius:6px;flex:none}
.likes:hover{color:var(--ink)}
.likes.on{color:var(--accent)}
.likes.on svg path{fill:currentColor}
.card.new-up .media{box-shadow:0 0 0 3px var(--accent)}

.skel{display:flex;gap:16px;margin-top:4px}
.skel>div{flex:1;display:flex;flex-direction:column;gap:22px}
.skel .sk{border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 25%,var(--fill) 50%,var(--surface) 75%);background-size:300% 100%;animation:shim 1.1s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-200% 0}}
.feed-end{min-height:40px}
.caught{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 0;color:var(--muted);font-size:13px}
.caught .ic{width:44px;height:44px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:70px 20px;gap:8px}
.empty .ic{width:64px;height:64px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--ink2);margin-bottom:6px}
.empty h3{margin:0;font-size:18px}
.empty p{margin:0 0 12px;color:var(--muted);max-width:420px}

/* community break */
.cbreak{margin:4px 0 26px;padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);animation:cardIn .35s ease both}
.cbreak-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cbreak-h b{font-size:15px}
.cbreak-h .muted{font-size:12px}
.cgrid{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:14px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.box h4{margin:0 0 12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.wrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.wrow .tx{flex:1;min-width:0}
.wrow .tx b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.wrow .tx b:hover{text-decoration:underline}
.wrow .tx span{font-size:12px;color:var(--muted)}
.trow{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:8px 6px;margin:0 -6px;border-radius:8px;font-size:13px;font-weight:500;text-align:left;width:calc(100% + 12px)}
.trow:hover{background:var(--surface)}
.trow span{color:var(--muted);font-size:12px;font-weight:400}
.trow+.trow{border-top:1px dashed var(--line)}
.chal-th{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chal-th .ph{height:84px;border-radius:10px;cursor:pointer}
.ccards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.ccard .th{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:12px}
.ccard .th .ph{aspect-ratio:1;border-radius:8px;cursor:pointer}
.colgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mosaic{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:4px;height:170px;border-radius:14px;overflow:hidden;cursor:pointer}
.mosaic .ph:first-child{grid-row:span 2}
.mosaic:hover{opacity:.9}

/* right community rail (wide) */
.crail{position:fixed;top:0;right:0;bottom:0;width:var(--crail);border-left:1px solid var(--line);background:#fafaf8;overflow-y:auto;padding:18px;display:none;flex-direction:column;gap:14px;z-index:20}
.crail .foot{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;padding:0 4px 10px}
.crail .foot button{border:0;background:none;padding:0;color:var(--muted);font-size:11px}
.crail .foot button:hover{color:var(--ink);text-decoration:underline}
@media (min-width:1536px){.crail{display:flex}.main{margin-right:var(--crail)}}
.crail .chal-row .grow{flex-basis:100%}
.crail .nitem{padding:8px 4px 8px 14px;margin:0 -4px;border-radius:10px}
.crail .nitem.unread::before{left:2px}
.crail .nitem .th,.crail .nitem>.btn{display:none}
.crail .nitem .av{width:30px;height:30px}

/* profile */
.pcover{height:180px;border-radius:0 0 24px 24px;margin:0 -24px}
.phead{position:relative;z-index:1;display:flex;align-items:flex-end;gap:20px;margin-top:-48px;padding:0 8px;flex-wrap:wrap}
.phead .info{flex:1;min-width:240px;padding-bottom:4px}
.phead h1{margin:0;font-size:28px;letter-spacing:-.02em}
.phead .role{color:var(--ink2);margin-top:2px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hire{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--fill)}
.hire i{width:7px;height:7px;border-radius:50%;background:#2a9d5c}
.pstats{display:flex;gap:28px;margin:20px 8px 0;flex-wrap:wrap}
.pstats div b{display:block;font-size:18px}
.pstats div span{font-size:12px;color:var(--muted)}
.pstats button{border:0;background:none;padding:0;text-align:left}
.pstats button:hover b{text-decoration:underline}
.ptabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:22px 0 20px}
.ptabs button{border:0;background:none;padding:10px 0;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button.on{color:var(--ink);border-color:var(--ink)}
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;max-width:960px}
.about p{margin:0 0 12px;color:var(--ink2)}

/* collections */
.cgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;margin-top:20px}
.coll-card{border:0;background:none;padding:0;text-align:left}
.coll-card .mosaic{height:200px}
.coll-card b{display:block;margin-top:10px;font-size:15px}
.coll-card span{font-size:12px;color:var(--muted)}
.coll-new .mosaic{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line2);background:#fff;color:var(--ink2);flex-direction:column;gap:8px}

/* jobs */
.jobs{display:flex;flex-direction:column;gap:12px;margin-top:16px;max-width:980px}
.job{display:flex;gap:16px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}
.job:hover{border-color:var(--line2)}
.job .lg{width:52px;height:52px;border-radius:12px;flex:none}
.job .tx{flex:1;min-width:0}
.job .tx b{font-size:15px}
.job .tx .m{font-size:13px;color:var(--muted);margin:2px 0 8px}
.job .tags{display:flex;gap:6px;flex-wrap:wrap}

/* creators grid */
.crgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:10px}

/* ---------- overlays ---------- */
.layer{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.scrim{position:absolute;inset:0;background:rgba(20,20,18,.55);animation:fade .18s ease both}
@keyframes fade{from{opacity:0}}
.modal{position:relative;background:#fff;border-radius:22px;max-height:calc(100vh - 48px);overflow:auto;box-shadow:var(--shadow);animation:pop .2s ease both;width:min(560px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}}
.mhead{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.mhead h2{margin:0;font-size:17px;flex:1}
.mbody{padding:20px}
.mfoot{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}

/* detail */
.detail{width:min(1240px,100%);display:grid;grid-template-columns:minmax(0,1.6fr) minmax(340px,1fr);overflow:hidden;padding:0;height:min(820px,calc(100vh - 48px))}
.dstage{background:#1f1f1d;position:relative;display:flex;flex-direction:column;min-height:0}
.dstage .canvas{flex:1;display:flex;align-items:center;justify-content:center;padding:28px;min-height:0;position:relative}
.dstage .frame{position:relative;max-width:100%;max-height:100%;border-radius:12px;overflow:hidden;background:
  linear-gradient(to top right,transparent calc(50% - .6px),rgba(255,255,255,.12) 50%,transparent calc(50% + .6px)),
  linear-gradient(to top left,transparent calc(50% - .6px),rgba(255,255,255,.12) 50%,transparent calc(50% + .6px)),#3a3a37;cursor:pointer}
.dstage .frame img,.dstage .frame video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.dstage .frame .blob{background:#55554f}
.dstage .frame .blob.b2{background:#686862}
.dstage .frame .bigplay{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
.dstage .frame .bigplay span{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center}
.dstage .frame.paused .bigplay{display:flex}
.ctrl{display:flex;align-items:center;gap:12px;padding:12px 18px 16px;color:#e8e8e4;font-size:12px;font-variant-numeric:tabular-nums}
.ctrl button{border:0;background:none;color:#e8e8e4;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ctrl button:hover{background:rgba(255,255,255,.12)}
.ctrl .speed{width:auto;padding:0 8px;border-radius:6px;border:1px solid #555;height:26px;font-size:11px}
.bar{flex:1;height:18px;display:flex;align-items:center;cursor:pointer;position:relative}
.bar::before{content:"";position:absolute;left:0;right:0;height:4px;border-radius:2px;background:#4a4a46}
.bar i{position:absolute;left:0;height:4px;border-radius:2px;background:#fff;width:0}
.bar b{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;margin-left:-6px;transform:scale(0);transition:transform .1s}
.bar:hover b{transform:scale(1)}
.car-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;z-index:2}
.car-nav.l{left:16px}.car-nav.r{right:16px}
.car-nav[disabled]{opacity:.3;pointer-events:none}
.thumbs{display:flex;gap:8px;padding:0 18px 16px;overflow-x:auto}
.thumbs button{width:56px;height:42px;border-radius:8px;border:2px solid transparent;padding:0;flex:none;opacity:.6;overflow:hidden}
.thumbs button .ph{width:100%;height:100%;background-color:#3a3a37}
.thumbs button.on{border-color:#fff;opacity:1}
.dpanel{display:flex;flex-direction:column;min-height:0}
.dpanel .scroll{flex:1;overflow-y:auto;padding:20px 22px}
.dpanel h2{margin:16px 0 6px;font-size:22px;letter-spacing:-.02em;line-height:1.2}
.dpanel .desc{color:var(--ink2);margin:0 0 10px}
.dpanel .stats{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.dact{display:flex;align-items:center;gap:8px;margin:16px 0}
.dact .savegrp{margin-left:0}
.dact .scoll{background:var(--fill);height:40px}
.dact .sbtn{height:40px;padding:0 18px}
.dact .ibtn.liked{color:var(--accent);border-color:var(--accent)}
.dact .ibtn.liked svg path{fill:currentColor}
.mclose{position:absolute;top:14px;right:14px;z-index:5}
.dnav{position:fixed;top:50%;transform:translateY(-50%);z-index:3;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.dnav.l{left:18px}.dnav.r{right:18px}
.dnav[disabled]{opacity:.3;pointer-events:none}
.sect{margin-top:22px}
.sect .label{margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.more3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.more3 .ph{aspect-ratio:1;border-radius:10px;cursor:pointer}
.more3 .ph:hover{opacity:.85}
.cmt{display:flex;gap:10px;padding:8px 0}
.cmt .tx{font-size:13px;flex:1}
.cmt .tx b{cursor:pointer}
.cmt .tx b:hover{text-decoration:underline}
.cmt .tx .t{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:12px}
.cmt .tx .t button{border:0;background:none;padding:0;font-size:11px;color:var(--muted);font-weight:600}
.cmt .tx .t button:hover,.cmt .tx .t button.on{color:var(--accent)}
.cform{display:flex;align-items:center;gap:8px;padding:12px 22px;border-top:1px solid var(--line)}
.cform input{flex:1;border-radius:999px;background:var(--fill);border-color:transparent;padding:10px 16px}
.cform input:focus{background:#fff}
.chbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);margin-top:10px;cursor:pointer}

/* drawers */
.drawer-layer{position:fixed;inset:0;z-index:90}
.drawer{position:absolute;top:0;right:0;bottom:0;width:410px;max-width:100%;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slide .22s ease both}
@keyframes slide{from{transform:translateX(100%)}}
.drawer .dbody{flex:1;overflow-y:auto}
.nitem{display:flex;gap:12px;align-items:center;padding:12px 20px;position:relative;border:0;background:none;width:100%;text-align:left}
.nitem:hover{background:var(--surface)}
.nitem.unread::before{content:"";position:absolute;left:8px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--accent)}
.nitem .tx{flex:1;font-size:13px;color:var(--ink2)}
.nitem .tx b{color:var(--ink)}
.nitem .tx .t{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.nitem .th{width:44px;height:44px;border-radius:10px;flex:none}
.dfilters{display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.conv{display:flex;gap:12px;align-items:center;padding:12px 20px;width:100%;border:0;background:none;text-align:left}
.conv:hover{background:var(--surface)}
.conv .tx{flex:1;min-width:0}
.conv .tx b{display:flex;justify-content:space-between;font-size:14px}
.conv .tx b span{font-size:11px;color:var(--muted);font-weight:400}
.conv .tx p{margin:2px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.unread .tx p{color:var(--ink);font-weight:600}
.thread{display:flex;flex-direction:column;gap:8px;padding:20px}
.msg{max-width:78%;padding:9px 13px;border-radius:18px;font-size:13.5px;background:var(--fill);align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-left-radius:18px;border-bottom-right-radius:6px}
.msg.typing{color:var(--muted);font-style:italic}
.mtime{font-size:11px;color:var(--muted);text-align:center;margin:6px 0}

/* popover */
#pop{position:fixed;z-index:120;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px;min-width:230px;display:none;animation:pop .14s ease both;max-height:70vh;overflow:auto}
#pop.on{display:block}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:10px;text-align:left;font-size:14px}
.mi:hover,.mi.hl{background:var(--surface)}
.mi .ph{width:36px;height:36px;border-radius:8px;flex:none}
.mi .sub{margin-left:auto;font-size:12px;color:var(--muted)}
.mi.on .ck{display:flex}
.mi .ck{display:none;margin-left:auto}
.msep{height:1px;background:var(--line);margin:6px 4px}
.ptitle{font-size:12px;font-weight:700;padding:6px 10px 8px;color:var(--ink2)}
.hovercard{width:300px;padding:16px!important}

/* toast */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:140;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px 12px 18px;font-size:13.5px;box-shadow:var(--shadow);pointer-events:auto;animation:pop .2s ease both;max-width:min(520px,92vw)}
.toast button{border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px}
.toast button:hover{background:rgba(255,255,255,.24)}
.toast.out{opacity:0;transform:translateY(6px);transition:all .2s}

/* upload */
.upload{width:min(980px,100%)}
.steps{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.steps span{display:flex;align-items:center;gap:6px}
.steps i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px}
.steps .on{color:var(--ink)}
.steps .on i{background:var(--ink);border-color:var(--ink);color:#fff}
.steps .done i{background:var(--fill2);border-color:var(--fill2);color:var(--ink)}
.steps .sl{width:22px;height:1px;background:var(--line2)}
.drop{border:2px dashed var(--line2);border-radius:20px;padding:46px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;transition:background .12s,border-color .12s;cursor:pointer}
.drop:hover,.drop.over{background:var(--surface);border-color:var(--ink2)}
.drop .ic{width:60px;height:60px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center}
.drop h3{margin:6px 0 0;font-size:18px}
.drop p{margin:0;color:var(--muted);font-size:13px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.uth{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:#000}
.uth.cover{border-color:var(--ink)}
.uth img,.uth video,.uth .ph{width:100%;height:100%;object-fit:cover;display:block}
.uth .rm{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center}
.uth .cv{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:700;background:var(--ink);color:#fff;border-radius:6px;padding:2px 6px}
.uth.add{border:2px dashed var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--ink2);font-size:12px}
.ucols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.upv{border-radius:16px;overflow:hidden;background:#1f1f1d;aspect-ratio:4/3;position:relative;display:flex;align-items:center;justify-content:center}
.upv img,.upv video{width:100%;height:100%;object-fit:contain}
.upv .ph{width:100%;height:100%;background-color:#3a3a37}
.upv .blob{background:#55554f}
.rng{margin-top:14px}
.rng label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.rng input[type=range]{width:100%;accent-color:var(--ink)}
.tagin{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:12px;padding:6px 8px;min-height:44px;cursor:text}
.tagin:focus-within{border-color:var(--ink)}
.tagin .chip{height:28px;padding:0 6px 0 10px;font-size:12px;background:var(--fill)}
.tagin .chip button{border:0;background:none;padding:0;display:flex;color:var(--muted)}
.tagin input{border:0;outline:none;flex:1;min-width:100px;padding:4px;font-size:14px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;font-size:12px;color:var(--muted)}
.pbar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin:18px 0 10px}
.pbar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s linear}
.done-ic{width:72px;height:72px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.radio{display:flex;gap:8px}
.radio button{flex:1;border:1px solid var(--line2);background:#fff;border-radius:12px;padding:10px;text-align:left;font-size:13px}
.radio button b{display:block;font-size:13px}
.radio button span{font-size:12px;color:var(--muted)}
.radio button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* challenge */
.chal-hero{height:180px;border-radius:0;display:flex;align-items:flex-end;padding:20px}
.timer{display:flex;gap:8px;margin:14px 0}
.timer div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:center;min-width:62px}
.timer b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.timer span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.egrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.egrid .media{aspect-ratio:1;border-radius:12px}

/* settings */
.srow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border:0}
.srow .tx{flex:1}
.srow .tx b{display:block;font-size:14px}
.srow .tx span{font-size:12.5px;color:var(--muted)}

/* interests */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.itile{position:relative;border:2px solid transparent;border-radius:16px;padding:0;background:none;overflow:hidden;text-align:left}
.itile .ph{height:96px}
.itile b{display:block;padding:8px 10px;font-size:13px}
.itile .ck{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:#fff;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;color:transparent}
.itile.on{border-color:var(--ink)}
.itile.on .ck{background:var(--ink);border-color:var(--ink);color:#fff}

/* back to top & mobile bar */
.totop{position:fixed;right:24px;bottom:24px;z-index:35;width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(8px)}
.totop.on{opacity:1;pointer-events:auto;transform:none}
@media (min-width:1536px){.totop{right:calc(var(--crail) + 24px)}}
.mobbar{display:none;position:fixed;left:0;right:0;bottom:0;height:62px;background:#fff;border-top:1px solid var(--line);z-index:60;align-items:center;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}
.mobbar button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;position:relative;padding:6px 10px}
.mobbar button.on{color:var(--ink)}
.mobbar .up{width:46px;height:46px;border-radius:15px;background:var(--ink);color:#fff;justify-content:center;padding:0}
.mobbar .bdg{position:absolute;top:2px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* ---------- monetization ---------- */
.adtag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);background:var(--fill);border-radius:6px;padding:3px 7px;flex:none}
.adtag.on-media{position:absolute;top:10px;left:10px;z-index:2;background:rgba(255,255,255,.95);pointer-events:none}
.media:hover .adtag.on-media{display:none}
.plabel{border:0;background:none;padding:2px 6px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:6px;flex:none;white-space:nowrap}
button.plabel:hover{color:var(--ink);background:var(--surface)}
.adcta{margin-top:8px;justify-content:space-between;height:34px}
.pinb{position:absolute;top:10px;right:10px;z-index:2;background:var(--ink);color:#fff;font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:20px;display:flex;gap:4px;align-items:center;pointer-events:none}
.media:hover .pinb{display:none}
.jobad{border:1px solid var(--line2);border-radius:var(--r);padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.jobad .lg{width:44px;height:44px;border-radius:12px}
.jobad b{font-size:15px;line-height:1.25}
.ftag{display:inline-flex;align-items:center;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);background:var(--fill);border:0;border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:2px;cursor:pointer}
.av.sq{border-radius:9px;background:var(--ink);color:#fff}
.probadge{display:inline-flex;align-items:center;font-size:9.5px;font-weight:800;letter-spacing:.08em;background:var(--ink);color:#fff;border-radius:5px;padding:2px 6px;vertical-align:3px;border:0;margin-left:4px}
.sad{border:1px solid var(--line2);border-radius:18px;padding:14px 18px 16px;background:#fff;margin:0 0 12px}
.sad-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sad-body{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:16px;align-items:center}
.sad-tx .nm{border:0;background:none;padding:0;font-weight:700;font-size:14px}
.sad-tx .nm:hover{text-decoration:underline}
.sad-tx h3{margin:3px 0 3px;font-size:17px;letter-spacing:-.01em;line-height:1.25;cursor:pointer}
.sad-tx p{margin:0;color:var(--ink2);font-size:13px}
.sad-th{display:grid;grid-template-columns:repeat(3,72px);gap:6px}
.sad-th .ph,.sad-th img{width:72px;height:72px;border-radius:10px;cursor:pointer;object-fit:cover;display:block}
.sad-cta{display:flex;flex-direction:column;gap:6px}
.sad-foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:-2px 0 16px}
.sad.preview{pointer-events:none;margin:0}
.sad{container-type:inline-size}
@container (max-width:700px){.sad-body{grid-template-columns:auto minmax(0,1fr)}.sad-th{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr)}.sad-th .ph,.sad-th img{width:100%;height:auto;aspect-ratio:1}.sad-cta{grid-column:1/-1;flex-direction:row}}
.tko{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);margin:0 0 16px;font-size:13px;flex-wrap:wrap}
.tko .grow{min-width:180px}
.sopt .adtag{margin-left:auto}
/* hub */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}
.kpi{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}
.kpi span{font-size:12px;color:var(--muted);display:block}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpis.mini{grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.kpis.mini .kpi{padding:10px 12px;border-radius:12px}
.kpis.mini .kpi b{font-size:18px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.prod{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:6px;text-align:left;transition:border-color .12s,transform .12s}
.prod:hover{border-color:var(--ink2);transform:translateY(-1px)}
.prod .pi{width:40px;height:40px;border-radius:12px;background:var(--fill);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.prod b{font-size:15px}
.prod p{margin:0;font-size:13px;color:var(--muted);flex:1}
.prod .pr{font-size:12px;font-weight:700;color:var(--ink2);margin-top:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:#fff}
.ctable{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
.ctable th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.ctable td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.ctable tr:last-child td{border-bottom:0}
.spill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--fill);white-space:nowrap}
.spill i{width:7px;height:7px;border-radius:50%;background:var(--fill3)}
.spill.active i{background:#2a9d5c}.spill.paused i{background:#d29a0c}.spill.scheduled i{background:var(--ink2)}.spill.trial i{background:#2a9d5c}
.pbar.sm{height:4px;margin:6px 0 0;width:120px}
.sect-h{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px}
.sect-h h3{margin:0;font-size:17px}
.bars .brow{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center;font-size:12px;margin:7px 0}
.bars .track{height:8px;border-radius:4px;background:var(--fill)}
.bars .fill{height:100%;border-radius:4px;background:var(--ink2);min-width:2px}
.bars .v{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.locked{position:relative;border-radius:14px;overflow:hidden}
.locked>.blur{filter:blur(5px);pointer-events:none;user-select:none}
.locked>.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:rgba(255,255,255,.6);padding:14px}
/* builders & checkout */
.bgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px}
.radio.col{flex-direction:column}
.radio button[disabled]{opacity:.45;cursor:not-allowed}
.est{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);font-size:13px;color:var(--ink2)}
.est b{font-size:18px;display:block;color:var(--ink);font-variant-numeric:tabular-nums}
.kwhead,.kwrow{display:grid;grid-template-columns:minmax(0,1.3fr) 104px 96px 84px 84px 30px;gap:8px;align-items:center}
.kwhead{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:0 0 6px;border-bottom:1px solid var(--line)}
.kwrow{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.kwrow select{padding:6px 8px;border-radius:8px;font-size:12px}
.prevbox{border:1px dashed var(--line2);border-radius:16px;padding:14px;background:var(--surface)}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px;font-variant-numeric:tabular-nums}
.sumrow.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-weight:700;font-size:16px}
.paym{border:1px solid var(--line2);border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;cursor:pointer}
.paym .ck{display:none}
.paym.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.paym.on .ck{display:flex}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.tipamts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tipamts button{height:54px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-weight:700;font-size:16px}
.tipamts button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.perk{display:flex;gap:12px;align-items:flex-start;padding:7px 0;font-size:13.5px}
.perk .pi{width:30px;height:30px;border-radius:9px;background:var(--fill);display:flex;align-items:center;justify-content:center;flex:none}
.dact{flex-wrap:wrap}
.job.featured{border-color:var(--ink2);box-shadow:inset 0 0 0 1px var(--ink2)}
.job.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--fill)}100%{background:#fff}}
/* talent */
.tgrid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;margin-top:18px}
.tfil{position:sticky;top:calc(var(--hh) + 16px);align-self:start;display:flex;flex-direction:column;gap:18px}
.tfil .ctx{margin:0}
.tlist{display:flex;flex-direction:column;gap:12px}
.trow2{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}
.trow2 .th4{grid-column:2/-1;display:grid;grid-template-columns:repeat(4,64px);gap:6px}
.th4 .ph{height:64px;border-radius:10px;cursor:pointer}
.trow2 .ctx{margin:8px 0 0}
@media (max-width:1100px){.kpis{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.bgrid,.tgrid{grid-template-columns:1fr}.tfil{position:static}}
@media (max-width:767px){.kwhead,.kwrow{grid-template-columns:minmax(0,1fr) 92px 30px}.kwhead .hm,.kwrow .hm{display:none}.trow2{grid-template-columns:auto minmax(0,1fr)}.trow2 .acts{grid-column:1/-1}.trow2 .th4{grid-column:1/-1;grid-template-columns:repeat(4,1fr)}.tipamts button{height:46px}}
@media (max-width:1100px){.cgrid{grid-template-columns:1fr 1fr}.cgrid>.box:first-child{grid-column:span 2}.ccards{grid-template-columns:1fr 1fr}.colgrid{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .detail{grid-template-columns:1fr;height:auto;max-height:calc(100vh - 24px)}
  .dstage .canvas{min-height:50vh}
  .dpanel .scroll{overflow:visible}
  .dnav{display:none}
  .ucols{grid-template-columns:1fr}
  .about{grid-template-columns:1fr}
}
@media (max-width:767px){
  .rail{display:none}
  .main{margin-left:0!important}
  .mobbar{display:flex}
  body{padding-bottom:62px}
  .top{padding:0 12px;gap:8px}
  .up-lbl{display:none}
  .upbtn{width:46px;padding:0}
  .scope{display:none}
  .wrap{padding:0 12px 80px}
  .seg button{padding:6px 9px}
  .fbar{flex-wrap:wrap;gap:8px}
  .tabs{flex-basis:100%;order:-1}
  .cgrid{grid-template-columns:1fr}.cgrid>.box:first-child{grid-column:auto}
  .ccards,.colgrid{grid-template-columns:1fr}
  .egrid{grid-template-columns:repeat(3,1fr)}
  .layer{padding:12px}
  .totop{bottom:76px;right:14px}
  .pcover{margin:0 -12px}
  .job{flex-wrap:wrap}
  .job .tx{flex-basis:calc(100% - 68px)}
  .vh>.grow{flex-basis:100%}
  .job>.btn{flex:1}
  #toasts{bottom:76px}
  #slashHint{display:none!important}
  .steps>span:not(.on),.steps .sl{display:none}
  .mfoot>.muted:first-child{display:none}
  .upload .mbody>div[style*="justify-content:center"]{flex-wrap:wrap}
  .detail .dstage .canvas{padding:14px;min-height:46vh}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="Primary">
    <div class="rail-top">
      <button class="logo" data-act="nav" data-nav="home" aria-label="Home">LOGO</button>
      <button class="ibtn bare pinbtn" data-act="pin-rail" title="Pin sidebar open" id="pinBtn"></button>
    </div>
    <button class="ri" data-act="nav" data-nav="home"><i data-i="home" data-s="20"></i><span class="lbl">Home</span></button>
    <button class="ri" data-act="nav" data-nav="following"><i data-i="users" data-s="20"></i><span class="lbl">Following</span></button>
    <button class="ri" data-act="nav" data-nav="motion"><i data-i="film" data-s="20"></i><span class="lbl">Motion</span></button>
    <button class="ri" data-act="nav" data-nav="collections"><i data-i="folder" data-s="20"></i><span class="lbl">Collections</span></button>
    <button class="ri" data-act="nav" data-nav="jobs"><i data-i="briefcase" data-s="20"></i><span class="lbl">Jobs</span></button>
    <button class="ri" data-act="nav" data-nav="ads"><i data-i="chart" data-s="20"></i><span class="lbl">Promote &amp; earn</span></button>
    <div class="rsep"></div>
    <button class="ri" data-act="activity" id="riAct"><i data-i="bell" data-s="20"></i><span class="lbl">Activity</span></button>
    <button class="ri" data-act="messages" id="riMsg"><i data-i="chat" data-s="20"></i><span class="lbl">Messages</span></button>
    <div class="rsep"></div>
    <div class="rcolls" id="railColls"></div>
    <div class="rail-bot">
      <button class="ri" data-act="settings"><i data-i="settings" data-s="20"></i><span class="lbl">Settings</span></button>
      <button class="ri me" data-act="me-menu" id="meBtn"></button>
    </div>
  </aside>

  <div class="main" id="main">
    <header class="top">
      <div class="swrap" id="swrap">
        <form class="search" id="sform" role="search" autocomplete="off">
          <i data-i="search"></i>
          <input id="sq" type="text" placeholder="Search designs, motion, creators…" aria-label="Search" />
          <button type="button" class="ibtn bare clr" data-act="search-clear" title="Clear" style="width:30px;height:30px"><i data-i="x" data-s="14"></i></button>
          <span class="kbd" id="slashHint" title="Press / to search">/</span>
          <button type="button" class="scope" data-act="scope" id="scopeBtn">All <i data-i="down" data-s="12"></i></button>
          <button type="button" class="ibtn bare" data-act="camera" title="Search with an image" style="width:36px;height:36px"><i data-i="camera"></i></button>
        </form>
        <div class="sdrop" id="sdrop"></div>
      </div>
      <button class="btn primary upbtn" data-act="upload"><i data-i="plus" data-s="16"></i><span class="up-lbl">Upload</span></button>
    </header>
    <div id="view"></div>
  </div>

  <aside class="crail" id="crail" aria-label="Community"></aside>
</div>

<nav class="mobbar" id="mobbar">
  <button data-act="nav" data-nav="home"><i data-i="home" data-s="22"></i>Home</button>
  <button data-act="focus-search"><i data-i="search" data-s="22"></i>Search</button>
  <button class="up" data-act="upload" aria-label="Upload"><i data-i="plus" data-s="22"></i></button>
  <button data-act="activity"><i data-i="bell" data-s="22"></i>Activity<span class="bdg" id="mobBdg"></span></button>
  <button data-act="nav" data-nav="profile/me"><i data-i="user" data-s="22"></i>Profile</button>
</nav>

<button class="totop" id="totop" data-act="top" title="Back to top"><i data-i="arrowUp" data-s="18"></i></button>
<div id="layers"></div>
<div id="pop" role="menu"></div>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="fileUp" accept="image/*,video/*" multiple hidden>
<input type="file" id="fileVis" accept="image/*" hidden>

<script>
/* =========================================================

const vis=new Map();let hoverMotion=null;
const mio=new IntersectionObserver(es=>{es.forEach(e=>vis.set(e.target,e.intersectionRatio));schedulePlay();},{threshold:[0,.3,.6,.9,1]});
function observeMotion(root){$$('.media.motion',root).forEach(m=>{if(!m.dataset.obs){m.dataset.obs=1;mio.observe(m);}})}
let rafP=0;function schedulePlay(){if(rafP)return;rafP=requestAnimationFrame(()=>{rafP=0;updatePlaying();});}
function updatePlaying(){
  const blocked=layers.children.length>0;
  document.body.classList.toggle('noauto',!S.set.autoplay||reduced());
  const allow=S.set.autoplay&&!reduced()&&!blocked;
  const cy=innerHeight/2,cand=[];
  for(const [el,r] of vis){if(!el.isConnected){vis.delete(el);continue}if(r>=.6){const b=el.getBoundingClientRect();cand.push([Math.abs(b.top+b.height/2-cy),el]);}}
  cand.sort((a,b)=>a[0]-b[0]);
  const play=new Set(allow?cand.slice(0,3).map(x=>x[1]):[]);
  if(hoverMotion&&hoverMotion.isConnected&&!blocked)play.add(hoverMotion);
  $$('.media.motion').forEach(el=>{if(el.closest('.layer'))return;setPlaying(el,play.has(el))});
}
function setPlaying(el,on){
  if(el.classList.contains('playing')===on)return;
  el.classList.toggle('playing',on);
  const v=el.querySelector('video');
  if(v){if(on){v.muted=!S.sound.has(el.dataset.id);v.play().catch(()=>{})}else{v.pause();const it=IT[el.dataset.id];try{v.currentTime=it?.poster||0}catch{}}}
}
addEventListener('scroll',schedulePlay,{passive:true});
document.addEventListener('mouseover',e=>{const m=e.target.closest?.('.media.motion');if(m!==hoverMotion){hoverMotion=m;schedulePlay();}});

let FC=null;const PAGE=20;
function colCount(el){const w=el.clientWidth||900;return Math.max(2,Math.min(6,Math.floor((w+16)/(230+16))));}
function masonryHTML(items,cols,w){
  const cw=(w-(cols-1)*16)/cols;const hs=Array(cols).fill(0);const cs=Array.from({length:cols},()=>[]);
  items.forEach(it=>{let k=hs.indexOf(Math.min(...hs));cs[k].push(it._ad?adCardHTML(it._ad):cardHTML(it));hs[k]+=cw*it.ratio+52;});
  return `<div class="mas">${cs.map(c=>`<div class="mcol">${c.join('')}</div>`).join('')}</div>`;
}
function skeletonHTML(cols){const hs=[260,190,320,220,280,200];return `<div class="skel">${Array.from({length:cols},(_,i)=>`<div><div class="sk" style="height:${hs[i%6]}px"></div><div class="sk" style="height:${hs[(i+3)%6]}px"></div></div>`).join('')}</div>`;}
function mountFeed(el,list,opt={}){
  FC={el,list:visible(list),opt,slices:[],loading:false,breakN:0};
  if(!FC.list.length){el.innerHTML=opt.empty||emptyHTML('search','Nothing here yet','Try another topic, tab or filter.');hydrate(el);return;}
  el.innerHTML='<div class="chunks"></div><div class="feed-end"></div>';
  FC.cols=colCount(el);
  loadMore(true);
}
const loadedCount=()=>FC?FC.slices.reduce((a,s)=>a+s.items.length,0):0;
function showBreaks(){return FC.opt.breaks&&S.set.breaks&&!S.hideBreaks&&!isWide();}
function chunkHTML(s){return masonryHTML(withAds(s),FC.cols,$('.chunks',FC.el).clientWidth)+(s.brk!=null&&showBreaks()?breakHTML(s.brk):'');}
function loadMore(now){
  if(!FC||FC.loading)return;const n=loadedCount();if(n>=FC.list.length)return;
  FC.loading=true;const end=$('.feed-end',FC.el);
  if(!now)end.innerHTML=skeletonHTML(FC.cols);
  setTimeout(()=>{
    if(!FC||!FC.el.isConnected)return;
    const items=FC.list.slice(n,n+PAGE);const more=n+PAGE<FC.list.length;
    const s={items,brk:FC.opt.breaks&&more?FC.breakN++:null};s.ads=feedAdsFor(FC.slices.length,items);FC.slices.push(s);
    const box=$('.chunks',FC.el);box.insertAdjacentHTML('beforeend',chunkHTML(s));

    end.innerHTML=loadedCount()>=FC.list.length?`<div class="caught"><span class="ic">${ic('check',20)}</span>You’re all caught up · ${FC.list.length} pieces<button class="btn sm" data-act="top">Back to top</button></div>`:'';
    checkEnd();

}
function checkEnd(){if(!FC)return;const end=$('.feed-end',FC.el);if(end&&end.getBoundingClientRect().top<innerHeight+900)loadMore();}
addEventListener('scroll',()=>{checkEnd();$('#totop').classList.toggle('on',scrollY>1400);const fb=$('.fbar');if(fb)fb.classList.toggle('stuck',fb.getBoundingClientRect().top<=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hh'))+1);},{passive:true});
function relayout(){
  if(!FC||!FC.el.isConnected||!FC.slices.length)return;
  const c=colCount(FC.el);FC.cols=c;

/* ---------- list builders ---------- */
function applyFilters(list){
  const f=S.filters;
  if(f.time!=='any'){const max={day:1,week:7,month:30}[f.time];list=list.filter(i=>i.days<=max);}
  if(f.hire)list=list.filter(i=>CR[i.creator].hire);
  if(f.multi)list=list.filter(i=>i.imgs>1);
  if(f.tools.length)list=list.filter(i=>i.tools.some(t=>f.tools.includes(t)));
  return list;
}
const filterCount=()=>{const f=S.filters;return (f.time!=='any')+f.hire+f.multi+f.tools.length};
function order(list,tab){
  if(tab==='latest')return list.slice().sort((a,b)=>(b.fresh?1:0)-(a.fresh?1:0)||a.days-b.days);
  if(tab==='popular')return list.slice().sort((a,b)=>b.likes-a.likes);
  const jit=id=>{let h=7;for(const ch of id)h=(h*31+ch.charCodeAt(0))>>>0;return (h%1000)/250};const sc=new Map(list.map(i=>[i.id,(i.fresh?1e9:0)+Math.log(i.likes+10)+jit(i.id)+(S.following.has(i.creator)?1.2:0)-i.days*.03+(S.interests.includes(i.cat)?.5:0)]));
  return list.slice().sort((a,b)=>sc.get(b.id)-sc.get(a.id));
}
function homeList(){
  let l=ITEMS.filter(i=>(i.creator!=='me'||i.fresh)&&!i.unlisted);
  if(S.tab==='following')l=ITEMS.filter(i=>S.following.has(i.creator));
  if(S.topic!=='all')l=l.filter(i=>i.cat===S.topic);
  if(S.format!=='all')l=l.filter(i=>S.format==='motion'?i.type==='motion':i.type!=='motion');
  return order(applyFilters(l),S.tab==='following'?'latest':S.tab);
}

const sq=$('#sq'),swrap=$('#swrap'),sdrop=$('#sdrop');let shl=-1;
function syncSearchUI(){$('#sform').classList.toggle('has',!!sq.value);$('#scopeBtn').innerHTML=`${{all:'All',image:'Images',motion:'Motion',creators:'Creators'}[S.scope]} ${ic('down',12)}`;$('#slashHint').style.display=sq.value||document.activeElement===sq?'none':'';}
function openSearch(){swrap.classList.add('open');renderSdrop();syncSearchUI();}
function closeSearch(){swrap.classList.remove('open');shl=-1;syncSearchUI();}
function hlText(t,q){if(!q)return esc(t);const i=t.toLowerCase().indexOf(q.toLowerCase());return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));}
function renderSdrop(){
  const q=sq.value.trim();let h='';
  if(!q){
    h+=S.recent.length?`<div class="sgroup"><div class="label">Recent <button class="lnk muted" style="font-size:11px;font-weight:500;text-transform:none;letter-spacing:0" data-act="recent-clear">Clear</button></div><div class="recent">${S.recent.map(r=>`<span class="chip"><button class="lnk" style="text-decoration:none;font-weight:500;color:var(--ink2)" data-act="search-q" data-q="${esc(r)}">${esc(r)}</button><span class="x" role="button" data-act="recent-rm" data-q="${esc(r)}">${ic('x',12)}</span></span>`).join('')}</div></div>`:'';
    h+=`<div class="sgroup"><div class="label">Trending</div>${trendRows('sopt',5)}</div>`;
    h+=`<div class="sgroup"><div class="label">Creators you might like</div>${suggested(3).map(c=>`<button class="sopt" data-act="creator" data-creator="${c.id}">${avHTML(c,'s36')}<span><b>${esc(c.name)}</b><br><span class="muted" style="font-size:12px">${esc(c.role)}</span></span></button>`).join('')}</div>`;
  } else {
    const ql=q.toLowerCase();
    const tags=[...new Set(ITEMS.flatMap(i=>i.tags))].filter(t=>t.includes(ql.replace(/^#/,''))).slice(0,4);
    const crs=CREATORS.filter(c=>c.id!=='me'&&c.name.toLowerCase().includes(ql)).slice(0,3);
    const its=ITEMS.filter(i=>i.title.toLowerCase().includes(ql)).filter((v,i,a)=>a.findIndex(x=>x.title===v.title)===i).slice(0,4);
    h+=`<div class="sgroup"><button class="sopt" data-act="search-q" data-q="${esc(q)}">${ic('search',16)}<span>Search for “<b>${esc(q)}</b>” in ${{all:'everything',image:'images',motion:'motion',creators:'creators'}[S.scope]}</span><span class="sub"><span class="kbd">↵</span></span></button></div>`;
    h+=sugAdHTML(q);
    if(its.length)h+=`<div class="sgroup"><div class="label">Work</div>${its.map(i=>`<button class="sopt" data-act="search-q" data-q="${esc(i.title)}"><span class="ph t${i.tone}"></span><span>${hlText(i.title,q)}</span><span class="sub">${esc(i.cat)}${i.type==='motion'?' · motion':''}</span></button>`).join('')}</div>`;
    if(tags.length)h+=`<div class="sgroup"><div class="label">Tags</div>${tags.map(t=>`<button class="sopt" data-act="search-q" data-q="${t}"><span>#${hlText(t,ql.replace(/^#/,''))}</span></button>`).join('')}</div>`;
    if(crs.length)h+=`<div class="sgroup"><div class="label">Creators</div>${crs.map(c=>`<button class="sopt" data-act="creator" data-creator="${c.id}">${avHTML(c,'s36')}<span>${hlText(c.name,q)}</span><span class="sub">${esc(c.role)}</span></button>`).join('')}</div>`;
  }
  sdrop.innerHTML=h;shl=-1;
}
sq.addEventListener('focus',openSearch);
sq.addEventListener('input',()=>{renderSdrop();syncSearchUI();});
sq.addEventListener('keydown',e=>{
  const opts=$$('.sopt',sdrop);
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!opts.length)return;shl=(shl+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length;opts.forEach((o,i)=>o.classList.toggle('hl',i===shl));opts[shl].scrollIntoView({block:'nearest'});}
  else if(e.key==='Enter'&&shl>=0&&opts[shl]){e.preventDefault();opts[shl].click();}
  else if(e.key==='Escape'){sq.blur();closeSearch();}
});
$('#sform').addEventListener('submit',e=>{e.preventDefault();doSearch(sq.value);});
document.addEventListener('mousedown',e=>{if(swrap.classList.contains('open')&&!swrap.contains(e.target)&&!pop.contains(e.target))closeSearch();});
function doSearch(q,scope){
  q=(q||'').trim();if(scope)S.scope=scope;
  if(q){S.recent=[q.toLowerCase(),...S.recent.filter(r=>r!==q.toLowerCase())].slice(0,6);}
  else if(S.scope!=='creators')return;
  sq.blur();closeSearch();
  go(`search?q=${encodeURIComponent(q)}&scope=${S.scope}`);
}

function startPlayer(it,d){
  const frame=$('#dframe',d),v=frame.querySelector('video');
  DP={it,d,frame,v,t:0,dur:it.dur,playing:true,muted:false,speed:1,last:performance.now(),raf:0};
  if(v){v.muted=false;v.addEventListener('loadedmetadata',()=>{DP&&(DP.dur=v.duration||it.dur);});v.play().catch(()=>{DP&&(DP.muted=true,v.muted=true,v.play().catch(()=>{}),updMute());});}
  if(reduced()){DP.playing=false;v&&v.pause();}
  const tick=now=>{if(!DP)return;const dt=(now-DP.last)/1000;DP.last=now;
    if(DP.v){DP.t=DP.v.currentTime;}else if(DP.playing){DP.t+=dt*DP.speed;if(DP.t>=DP.dur)DP.t=0;}
    const p=DP.t/DP.dur*100;const bar=$('#pbar',d);if(bar){bar.querySelector('i').style.width=p+'%';bar.querySelector('b').style.left=p+'%';}
    const tm=$('#ptime',d);if(tm)tm.textContent=`${dur(DP.t)} / ${dur(DP.dur)}`;
    DP.raf=requestAnimationFrame(tick);};
  DP.raf=requestAnimationFrame(tick);updPlay();updMute();
}

function saveTo(id,cid,quiet){
  const prev=S.saved[id];if(prev&&CO[prev])CO[prev].items=CO[prev].items.filter(x=>x!==id);
  S.saved[id]=cid;CO[cid].items.unshift(id);S.lastColl=cid;refreshItem(id);renderRailColls();
  if(!quiet)toast(`Saved to <b>${esc(CO[cid].name)}</b>`,{action:'Change',fn:()=>{const a=$(`.card[data-id="${id}"] [data-act="save-menu"]`)||$(`.detail [data-act="save-menu"]`);if(a){a.closest('.media')?.classList.add('pop-open');openSaveMenu(a,id);}}});
}
function unsave(id){const cid=S.saved[id];if(!cid)return;CO[cid].items=CO[cid].items.filter(x=>x!==id);delete S.saved[id];refreshItem(id);renderRailColls();
  const r=route();if(r.name==='collections'&&r.arg===cid){const card=$(`.card[data-id="${id}"]`);card?.remove();}

  openPop(anchor,`<div class="ptitle">Save to collection</div><div style="padding:0 4px 6px"><input type="text" id="pq" placeholder="Search collections" style="height:38px;border-radius:10px"></div><div id="plist">${list('')}</div><div class="msep"></div>
   <form id="pnew" style="display:flex;gap:6px;padding:4px"><input type="text" id="pname" placeholder="New collection name" maxlength="40" style="height:38px;border-radius:10px"><button class="btn sm primary" style="height:38px">Create</button></form>
   ${cur?`<div class="msep"></div><button class="mi" data-unsave="1">${ic('trash',16)} Remove from ${esc(CO[cur].name)}</button>`:''}`,{cls:'keep',onOpen:p=>{
    const bind=()=>$$('[data-pick]',p).forEach(b=>b.onclick=()=>{closePop();saveTo(id,b.dataset.pick);});bind();

    $('[data-unsave]',p)?.addEventListener('click',()=>{closePop();unsave(id);});

function bindDetails(m){

  bindTagIn();

    v.addEventListener('error',()=>{v.insertAdjacentHTML('afterend','<span style="position:absolute;color:#ddd;font-size:13px;padding:20px;text-align:center">This browser can’t preview this video format. It will still publish — try MP4 (H.264) or WebM.</span>');});}
  if(pfr)pfr.oninput=()=>{U.poster=+pfr.value;$('#pfv',m).textContent=dur(U.poster);if(v){v.pause();m._looping=false;try{v.currentTime=U.poster}catch{}}const b=$('#upblob',m);if(b){const p=U.poster/(U.vdur||20);b.style.transform=`translate(${p*180}%,${Math.sin(p*6)*60+40}%) scale(${.8+p*.5})`;}};

  if(v)v.addEventListener('timeupdate',()=>{if(m._looping&&v.currentTime>U.loopStart+U.loopLen)v.currentTime=U.loopStart;});

function addFiles(fl){
  if(!U)return;const arr=[...fl];if(!arr.length)return;
  const vids=arr.filter(f=>f.type.startsWith('video/')),imgs=arr.filter(f=>f.type.startsWith('image/'));
  if(arr.length&&!vids.length&&!imgs.length){toast('That file type isn’t supported. Try JPG, PNG, GIF, MP4 or WebM.');return;}
  if(vids.length){
    if(U.files.length)toast('Motion posts take one video, so it replaced the previous files.');
    U.files=[{kind:'video',url:URL.createObjectURL(vids[0]),name:vids[0].name}];U.cover=0;U.poster=0;U.loopStart=0;
    if(vids.length>1||imgs.length)toast('Only the first video was added. Motion posts are a single video.');
  } else {
    if(isMotionUp())U.files=[];
    const room=20-U.files.length;imgs.slice(0,room).forEach(f=>U.files.push({kind:'image',url:URL.createObjectURL(f),name:f.name}));
    if(imgs.length>room)toast('Projects can have up to 20 images.');
  }
  renderUpload();
}
function publishRun(l){
  const mo=isMotionUp();const stages=mo?['Uploading video…','Generating 8s preview loop…','Extracting poster frame…','Publishing…']:['Uploading files…','Optimising images…','Publishing…'];
  let p=0;const t=setInterval(()=>{
    if(!U||!l.isConnected){clearInterval(t);return;}
    p=Math.min(100,p+4+Math.random()*7);$('#upbar',l).style.width=p+'%';$('#uppct',l).textContent=Math.floor(p)+'%';$('#upstat',l).textContent=stages[Math.min(stages.length-1,Math.floor(p/100*stages.length))];
    if(p>=100){clearInterval(t);finishPublish(l);}
  },90);
}
function finishPublish(l){
  const cv=U.files[U.cover]||U.files[0];const mo=isMotionUp();
  const it=mkItem(0,{id:'u'+Date.now(),creator:'me',cat:U.cat,type:mo?'motion':'image',title:U.title.trim(),days:0});
  Object.assign(it,{likes:0,views:0,comments:[],fresh:Date.now(),imgs:mo?1:U.files.length,tags:U.tags.length?U.tags.slice():it.tags,tools:U.tools?U.tools.split(',').map(s=>s.trim()).filter(Boolean):it.tools,desc:U.desc.trim()||`New ${U.cat.toLowerCase()} work by Adam.`,challenge:U.challenge,poster:U.poster,loopStart:U.loopStart,loopLen:U.loopLen});
  if(cv.kind==='image'||cv.kind==='video'){it.src=cv.url;it.kind=cv.kind;}
  if(cv.kind==='video'){it.dur=Math.round(U.vdur||12);}
  const finalize=()=>{ITEMS.unshift(it);IT[it.id]=it;
    if(U.hire)CR.me.hire=true;
    const mb=$('.modal',l);mb.innerHTML=`<div class="mhead"><h2>Published</h2>${(U.step=4,stepsHTML()).replace(/class="on"/g,'class="done"')}<button class="ibtn bare" data-uact="close" title="Close">${ic('x',18)}</button></div>
    <div class="mbody" style="text-align:center;padding:44px 30px"><div class="done-ic">${ic('check',34)}</div><h2 style="margin:0 0 6px;font-size:22px">Your work is live</h2><p class="muted" style="margin:0 0 22px">“${esc(it.title)}” is on your profile${U.vis==='public'?' and in the Latest feed':' (unlisted)'}${U.challenge?' and entered into challenge #42':''}.</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" data-uact="again">Upload another</button><button class="btn" data-act="boost" data-id="${it.id}">${ic('zap',14)} Boost this post</button><button class="btn" data-uact="profile">Go to profile</button><button class="btn primary" data-uact="view" data-id="${it.id}">View post</button></div></div>`;
    U.step=3;U.done=it.id;
    if(U.vis==='unlisted')it.unlisted=true;
    const r=route();if(['home','profile','motion'].includes(r.name))render(true);
    toast(`Published “${esc(it.title)}”`,{action:'View',fn:()=>openDetail(it.id)});
  };
  if(it.src&&it.kind==='image'){const im=new Image();im.onload=()=>{it.ratio=Math.max(.5,Math.min(1.8,im.naturalHeight/im.naturalWidth));finalize();};im.onerror=finalize;im.src=it.src;}
  else if(it.src&&it.kind==='video'){const vv=document.createElement('video');vv.preload='metadata';vv.onloadedmetadata=()=>{if(vv.videoWidth)it.ratio=Math.max(.5,Math.min(1.8,vv.videoHeight/vv.videoWidth));finalize();};vv.onerror=finalize;vv.src=it.src;}
  else finalize();
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-uact]');if(!b||!U)return;const l=b.closest('.layer');const k=+b.dataset.k;

    case 'looplen':U.loopLen=+b.dataset.v;$$('[data-uact="looplen"]',l).forEach(x=>x.classList.toggle('on',x===b));{const lpr=$('#lpr',l);if(lpr){lpr.max=Math.max(0,(U.vdur||20)-U.loopLen);U.loopStart=Math.min(U.loopStart,+lpr.max);lpr.value=U.loopStart;}$('#lpv',l).textContent=`${dur(U.loopStart)}–${dur(U.loopStart+U.loopLen)}`;}break;
    case 'loopplay':{const m=$('.modal',l);const v=$('#upv',l);if(v){m._looping=!m._looping;if(m._looping){v.currentTime=U.loopStart;v.play();b.innerHTML=ic('pause',10)+' Stop preview';}else{v.pause();b.innerHTML=ic('play',10)+' Preview loop';}}else{const bl=$('#upblob',l);const on=bl.style.animation==='none'||!bl.style.animation;bl.style.animation=on?'drift 4s ease-in-out infinite':'none';bl.style.transform='';b.innerHTML=ic(on?'pause':'play',10)+(on?' Stop preview':' Preview loop');}}break;
    case 'tagrm':U.tags.splice(k,1);$('.modal',l)._redrawTags();break;
    case 'tagadd':$('.modal',l)._addTag(b.dataset.v);break;
    case 'again':{const ch=U.challenge;U=null;l.remove();openUpload({challenge:false});}break;
    case 'profile':l.remove();U=null;document.body.classList.remove('locked');S.ptab='work';go('profile/me');break;
    case 'view':{const id=b.dataset.id;l.remove();U=null;document.body.classList.remove('locked');openDetail(id);}break;
  }
});

document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if(e.key==='Escape'){if(pop.classList.contains('on')){closePop();return;}if(layers.lastElementChild){closeModal();return;}if($('.drawer-layer')){closeDrawer();return;}}
  if(typing)return;
  if(e.key==='/'&&!layers.children.length){e.preventDefault();sq.focus();}
  const det=$('.layer[data-kind="detail"]');
  if(det&&det===layers.lastElementChild){
    const it=IT[$('.detail',det).dataset.id];
    if(e.key==='ArrowRight'){detailStep(1);}
    if(e.key==='ArrowLeft'){detailStep(-1);}
    if(e.key===' '&&DP){e.preventDefault();DP.playing=!DP.playing;DP.last=performance.now();updPlay();}
    if(e.key.toLowerCase()==='s'){S.saved[it.id]?unsave(it.id):saveTo(it.id,S.lastColl);}
    if(e.key.toLowerCase()==='l'){toggleLike(it.id);}
  }
  if((e.key==='Enter'||e.key===' ')&&document.activeElement?.matches('.media[data-act="open"],.nitem')){e.preventDefault();document.activeElement.click();}
});

/* ---------- keyword matching & auction ---------- */
function normQ(q){return String(q||'').toLowerCase().trim().replace(/^#/,'').replace(/[-_]/g,' ').replace(/\s+/g,' ');}
function kwMatch(q,kw,type){
  q=normQ(q);kw=normQ(kw);if(!q||!kw)return false;
  if(type==='exact')return q===kw||q===kw+'s'||q+'s'===kw;
  if(type==='phrase')return q.includes(kw);
  const stem=w=>w.length>5?w.slice(0,w.length-3):w;
  const qw=q.split(' '),kws=kw.split(' ');
  return kws.some(k=>qw.some(w=>w===k||(w.length>=4&&k.length>=4&&(w.startsWith(stem(k))||k.startsWith(stem(w))))));
}
const adLive=a=>a.status!=='paused'&&a.status!=='ended'&&!S.hiddenAds.has(a.id);
function searchAdsFor(q){
  if(!q||q==='trending')return [];
  const nq=normQ(q);
  return KWADS.filter(a=>adLive(a)&&(a.place?a.place.top:true)&&a.kws.some(([k,t])=>kwMatch(q,k,t))&&!(a.neg||[]).some(n=>nq.includes(normQ(n))))
    .sort((x,y)=>y.bid*y.q-x.bid*x.q).slice(0,2);
}
const KWKNOWN={illustration:[38200,'High',1.35],motion:[29400,'High',1.2],'logo reveal':[6100,'Medium',.85],dashboard:[21800,'High',1.1],branding:[24500,'High',1.25],'3d':[19800,'Medium',.95],'kinetic type':[5200,'Medium',.7],ui:[33100,'High',1.15],typography:[9600,'Medium',.65],lottie:[7400,'Low',.55],'motion designer':[4800,'Medium',.9],'product designer':[5600,'Medium',.95]};
function kwStats(kw){kw=normQ(kw);if(KWKNOWN[kw])return KWKNOWN[kw];let h=7;for(const ch of kw)h=(h*31+ch.charCodeAt(0))>>>0;return [Math.round((400+h%12000)/10)*10,['Low','Medium','High'][h%3],+(.3+(h%110)/100).toFixed(2)];}
function competitors(kw){return KWADS.filter(a=>!a.mine&&adLive(a)&&a.kws.some(([k,t])=>kwMatch(kw,k,t))).sort((x,y)=>y.bid*y.q-x.bid*x.q);}
function advInfo(a){
  const v=a.adv;
  if(v.type==='creator'){const c=CR[v.id];return {name:c.name,sub:c.role,av:avHTML(c,'s56'),creator:c};}
  const b=v.type==='brand'?BRANDS[v.id]:v;return {name:b.name,sub:b.what||b.url,av:brandAv(b,'s56'),url:b.url,brand:b};
}

/* ---------- feed ad slots: max 2 per 20 posts, never adjacent, relevant only ---------- */
function promoFits(p,items){
  const it=IT[p.itemId];if(!it||S.hidden.has(it.id)||S.hiddenAds.has(p.pid)||!adLive(p))return false;
  if(items&&items.some(i=>i.id===it.id))return false;
  const r=route().name;
  if(r==='motion'&&it.type!=='motion')return false;
  if((r==='home'||r==='motion')&&S.topic!=='all'&&it.cat!==S.topic)return false;
  if(r==='home'&&S.format!=='all'&&(S.format==='motion')!==(it.type==='motion'))return false;
  if(r!=='search'&&S.set.personalAds&&S.topic==='all'&&!S.interests.includes(it.cat))return false;
  return true;
}
function pickPromo(items,extra){
  const pool=PROMOS.filter(p=>promoFits(p,items)&&(!extra||extra(p)));if(!pool.length)return null;
  FC.usedMine=FC.usedMine||new Set();
  const mine=pool.find(p=>p.mine&&!FC.usedMine.has(p.pid));
  if(mine){FC.usedMine.add(mine.pid);return {kind:'promo',...mine};}
  FC.promoN=(FC.promoN||0)+1;return {kind:'promo',...pool[FC.promoN%pool.length]};
}
function pickSponsored(){
  if(isPro())return null;
  const r=route().name;
  const pool=SPONSORED.filter(s=>adLive(s)&&(r!=='motion'||s.cats.includes('Motion'))&&(S.topic==='all'||r==='search'||s.cats.includes(S.topic))&&!(r==='home'&&S.format==='motion')&&(!S.set.personalAds||s.cats.some(c=>S.interests.includes(c))));
  if(!pool.length)return null;FC.spN=(FC.spN||0)+1;return {kind:'sponsored',id:pool[FC.spN%pool.length].id};
}
function pickJobAd(){const j=JOBS.find(j=>j.featured&&!S.applied.has(j.id)&&!S.hiddenAds.has(j.id));return j?{kind:'job',id:j.id}:null;}
function feedAdsFor(chunkIdx,items){
  const o=FC.opt;if(!o.ads)return null;
  if(o.ads==='search'){if(chunkIdx>0)return null;const p=pickPromo(null,x=>x.kw.some(k=>kwMatch(o.q,k,'broad')));return p&&items.length>2?[{pos:2,ad:p}]:null;}
  const out=[];
  [3,13].forEach((pos,si)=>{
    if(pos>items.length)return;
    let kind=(chunkIdx+si)%2===0?'promo':'sponsored';
    if(chunkIdx===1&&si===0&&route().name==='home'&&S.topic==='all'&&S.format!=='motion')kind='job';
    let ad=kind==='job'?pickJobAd():kind==='sponsored'?pickSponsored():null;
    if(!ad)ad=pickPromo(items);
    if(ad)out.push({pos,ad});
  });
  return out.length?out:null;
}
function withAds(s){if(!s.ads)return s.items;const dup=new Set(s.ads.filter(x=>x.ad.kind==='promo').map(x=>x.ad.itemId));const d=s.items.filter(i=>!dup.has(i.id));s.ads.slice().sort((a,b)=>b.pos-a.pos).forEach(x=>d.splice(x.pos,0,{_ad:x.ad,ratio:adRatio(x.ad)}));return d;}
function adRatio(a){return a.kind==='promo'?(IT[a.itemId]?.ratio||1):a.kind==='sponsored'?(SPMAP[a.id]?.ratio||1)+.2:1.05;}

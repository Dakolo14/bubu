      ${A.kws.map(([k,t],i)=>{const s=kwStats(k);return `<div class="kwrow"><b>${esc(k)}</b><select data-kwt="${i}">${[['broad','Broad'],['phrase','Phrase'],['exact','Exact']].map(([v,lb])=>`<option value="${v}" ${t===v?'selected':''}>${lb}</option>`).join('')}</select><span class="hm">${fmt(s[0])}</span><span class="hm">${s[1]}</span><span class="hm">${money(s[2])}</span><button type="button" class="ibtn bare" style="width:30px;height:30px" data-kwrm="${i}" title="Remove">${ic('x',14)}</button></div>`}).join('')}

      <div class="field" style="margin-top:18px"><span>Negative keywords <em class="muted" style="font-style:normal;font-weight:400">Never show for searches containing these</em></span><div class="tagin">${A.neg.map((t,i)=>`<span class="chip">${esc(t)}<button type="button" data-negrm="${i}">${ic('x',12)}</button></span>`).join('')}<input id="negin" placeholder="${A.neg.length?'':'e.g. free, tutorial'}"></div></div>`;
    } else if(A.step===2){
      body=`<div class="bgrid"><div>
        <div class="field"><span>Advertise as</span><div class="radio">${[['me','Your profile',CR.me.name],['brand','A studio or brand','Use a different name']].map(([k,t,s])=>`<button type="button" class="${A.as===k?'on':''}" data-as="${k}"><b>${t}</b><span>${esc(s)}</span></button>`).join('')}</div></div>
        ${A.as==='brand'?`<div style="display:flex;gap:10px"><label class="field grow"><span>Name</span><input type="text" id="sabr" value="${esc(A.brand)}" placeholder="Northwind Studio" maxlength="40"></label><label class="field grow"><span>Website</span><input type="text" id="sasi" value="${esc(A.site)}" placeholder="northwind.studio" maxlength="60"></label></div>`:''}
        <label class="field"><span>Headline <em class="muted" style="font-style:normal;font-weight:400" id="sahc">${A.headline.length}/60</em></span><input type="text" id="sah" value="${esc(A.headline)}" maxlength="60"></label>
        <label class="field"><span>Description</span><textarea id="sad" maxlength="140" style="min-height:64px">${esc(A.desc)}</textarea></label>
        <label class="field"><span>Button</span><select id="sac">${['Hire me','Hire us','View portfolio','Contact','See showreel','Learn more'].map(x=>`<option ${A.cta===x?'selected':''}>${x}</option>`).join('')}</select></label>
        ${A.as==='me'?`<div class="field"><span>Showcase (pick up to 3)</span><div class="ugrid" style="grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px">${mine.map(i=>`<div class="uth ${A.posts.includes(i.id)?'cover':''}" data-sapost="${i.id}" style="background:none" title="${esc(i.title)}">${thumbHTML(i)}</div>`).join('')}</div></div>`:''}
        <div class="field"><span>Placements</span>
          <label class="check" style="padding:4px 0"><input type="checkbox" id="pltop" ${A.place.top?'checked':''}><span><b>Top of search results</b><br><span class="muted">A sponsored card above the results, up to 2 per search.</span></span></label>
          <label class="check" style="padding:4px 0"><input type="checkbox" id="plsug" ${A.place.sug?'checked':''}><span><b>Search suggestions</b><br><span class="muted">One sponsored row while people type a matching word.</span></span></label></div>
      </div><div><div class="label" style="margin-bottom:8px">Preview</div><div class="prevbox" id="saprev">${sadHTML(preview(),true)}</div></div></div>`;
    } else {
      const total=A.daily*A.days;
      const vol=A.kws.reduce((s,[k])=>s+kwStats(k)[0],0);
      const clicksDay=Math.max(1,Math.min(Math.round(A.daily/A.bid),Math.round(vol/30*.06)));
      body=`<div class="bgrid"><div>
        <label class="field"><span>Max cost per click <em class="muted" style="font-style:normal;font-weight:400">Suggested ${money(sugBid())} · minimum ${money(PRICE.minCPC)}</em></span><div style="display:flex;align-items:center;gap:8px"><b>$</b><input type="number" id="sabid" min="${PRICE.minCPC}" step="0.05" value="${A.bid.toFixed(2)}" style="max-width:140px"></div></label>
        <div class="field"><span>Where you’d rank</span><div id="sarank">${rankHTML()}</div></div>
        <div class="field"><span>Daily budget <em class="muted" style="font-style:normal;font-weight:400" id="sadv">${money(A.daily)} / day</em></span><input type="range" id="sadaily" min="5" max="200" step="5" value="${A.daily}" style="accent-color:var(--ink)"></div>
        <div class="field"><span>Run for</span><div class="seg">${[7,14,30].map(d=>`<button type="button" class="${A.days===d?'on':''}" data-sadays="${d}">${d} days</button>`).join('')}</div></div>
      </div><div>
        <div class="est" id="saest"><b>~${fmt(clicksDay)} clicks / day</b>${fmt(vol)} monthly searches across ${A.kws.length} keyword${A.kws.length>1?'s':''}. You pay per click, never more than your max bid. Unspent budget is refunded.</div>
        <div class="label" style="margin:16px 0 8px">Summary</div>
        <div class="sumrow"><span>Keywords</span><span style="text-align:right">${A.kws.map(k=>esc(k[0])).join(', ')}</span></div>
        <div class="sumrow"><span>Placements</span><span>${[A.place.top&&'Top of results',A.place.sug&&'Suggestions'].filter(Boolean).join(' + ')||'None'}</span></div>
        <div class="sumrow total"><span>Budget (${A.days} days)</span><span id="satot">${money(total)}</span></div>
      </div></div>`;
    }
    m.innerHTML=`<div class="mhead"><h2>Search ads</h2>${stepper(['Keywords','Ad','Bid & budget'],A.step)}<button class="ibtn bare" data-act="close-modal">${ic('x',18)}</button></div>
     <div class="mbody">${body}</div>
     <div class="mfoot">${A.step>1?`<button class="btn" id="saback">${ic('left',14)} Back</button>`:''}<span class="grow"></span><span class="muted" style="font-size:12px" id="sahint"></span><button class="btn primary" id="sanext">${A.step<3?'Continue':'Continue to payment'}</button></div>`;
    bind(m);
  };
  function rankHTML(){return A.kws.map(([k])=>{const r=position(k);return `<div class="sumrow" style="font-size:13px"><span><b>${esc(k)}</b>${r.top?` <span class="muted">· top bid ${money(r.top.bid)} by ${esc(advInfo(r.top).name)}</span>`:' <span class="muted">· no competing bids</span>'}</span><span>${r.pos<=2?`Position ${r.pos} of 2`:'Not shown, raise bid'}</span></div>`}).join('');}
  function bind(m){
    const next=$('#sanext',m),hint=$('#sahint',m);
    const valid=()=>{let ok=true,msg='';if(A.step===1&&!A.kws.length){ok=false;msg='Add a keyword';}if(A.step===2){if(!A.headline.trim()){ok=false;msg='Add a headline';}else if(A.as==='brand'&&!A.brand.trim()){ok=false;msg='Add a studio or brand name';}else if(!A.place.top&&!A.place.sug){ok=false;msg='Pick at least one placement';}}if(A.step===3&&!(A.bid>=PRICE.minCPC)){ok=false;msg=`Minimum bid is ${money(PRICE.minCPC)}`;}next.disabled=!ok;hint.textContent=msg;};
    $('#saback',m)?.addEventListener('click',()=>{A.step--;draw();});
    next.onclick=()=>{
      if(A.step<3){A.step++;draw();return;}
      const total=A.daily*A.days;const comp=Math.max(0,...A.kws.map(([k])=>{const c=competitors(k).find(a=>a.bid*a.q<A.bid*.9);return c?c.bid*c.q/.9:0;}));const cpc=+Math.min(A.bid,Math.max(PRICE.minCPC,comp+.01)).toFixed(2);
      openCheckout({title:'Search ads',lines:[[`Search ads · ${A.days} days · ${money(A.daily)}/day`,total]],note:`You’re charged per click (est. ${money(cpc)}), up to your ${money(A.bid)} max bid. Unspent budget is refunded when the campaign ends.`,invoice:`Search ads · ${A.kws.map(k=>k[0]).join(', ')}`,
        successTitle:'Your search ad is live',successText:`Try searching “${esc(A.kws[0][0])}” to see it.`,after:['Search now',()=>{sq.value=A.kws[0][0];doSearch(A.kws[0][0]);}],
        onPaid:()=>{const c={id:'c'+Date.now(),type:'search',name:`Search · ${A.kws.map(k=>k[0]).join(', ')}`,detail:`Max ${money(A.bid)} CPC · ${money(A.daily)}/day · ${A.days} days`,status:'active',budget:total,spent:0,imps:0,clicks:0,cpc};
          CAMPS.unshift(c);const ad={...preview(),id:'k'+Date.now(),mine:true,camp:c.id,kws:A.kws.map(k=>k.slice()),neg:A.neg.slice(),bid:A.bid,q:.9,place:{...A.place},status:'active'};if(A.as!=='me')ad.adv.what=A.site||'Studio';KWADS.unshift(ad);l._guard=null;l.remove();}});
    };
    if(A.step===1){
      $('#kwf',m).onsubmit=e=>{e.preventDefault();const v=normQ($('#kwin',m).value);if(v&&!A.kws.some(k=>k[0]===v)&&A.kws.length<20)A.kws.push([v,'broad']);draw();$('#kwin',l).focus();};
      $$('[data-kwadd]',m).forEach(b=>b.onclick=()=>{A.kws.push([b.dataset.kwadd,'broad']);draw();});
      $$('[data-kwrm]',m).forEach(b=>b.onclick=()=>{A.kws.splice(+b.dataset.kwrm,1);draw();});
      $$('[data-kwt]',m).forEach(s=>s.onchange=()=>{A.kws[+s.dataset.kwt][1]=s.value;});
      $$('[data-negrm]',m).forEach(b=>b.onclick=()=>{A.neg.splice(+b.dataset.negrm,1);draw();});
      const ni=$('#negin',m);ni.onkeydown=e=>{if((e.key==='Enter'||e.key===',')&&ni.value.trim()){e.preventDefault();A.neg.push(normQ(ni.value));draw();$('#negin',l).focus();}};
    }
    if(A.step===2){
      const upd=()=>{$('#saprev',m).innerHTML=sadHTML(preview(),true);valid();};
      $$('[data-as]',m).forEach(b=>b.onclick=()=>{A.as=b.dataset.as;if(A.as==='brand'&&A.cta==='Hire me')A.cta='Hire us';draw();});
      $('#sah',m).oninput=e=>{A.headline=e.target.value;$('#sahc',m).textContent=`${A.headline.length}/60`;upd();};
      $('#sad',m).oninput=e=>{A.desc=e.target.value;upd();};
      $('#sac',m).onchange=e=>{A.cta=e.target.value;upd();};
      $('#sabr',m)&&($('#sabr',m).oninput=e=>{A.brand=e.target.value;upd();});
      $('#sasi',m)&&($('#sasi',m).oninput=e=>{A.site=e.target.value;upd();});
      $$('[data-sapost]',m).forEach(t=>t.onclick=()=>{const id=t.dataset.sapost;if(A.posts.includes(id))A.posts=A.posts.filter(x=>x!==id);else if(A.posts.length<3)A.posts.push(id);else{toast('Pick up to 3 posts');return;}t.classList.toggle('cover',A.posts.includes(id));upd();});
      $('#pltop',m).onchange=e=>{A.place.top=e.target.checked;valid();};
      $('#plsug',m).onchange=e=>{A.place.sug=e.target.checked;valid();};
    }
    if(A.step===3){
      $('#sabid',m).oninput=e=>{A.bid=Math.round((+e.target.value||0)*100)/100;$('#sarank',m).innerHTML=rankHTML();valid();};
      $('#sabid',m).onchange=()=>draw();
      $('#sadaily',m).oninput=e=>{A.daily=+e.target.value;$('#sadv',m).textContent=`${money(A.daily)} / day`;$('#satot',m).textContent=money(A.daily*A.days);};
      $('#sadaily',m).onchange=()=>draw();
      $$('[data-sadays]',m).forEach(b=>b.onclick=()=>{A.days=+b.dataset.sadays;draw();});
    }
    valid();
  }
  draw();
}

  if(f.tab==='short')list=list.filter(c=>S.shortlist.has(c.id));
  if(f.cats.length)list=list.filter(c=>c.cats.some(x=>f.cats.includes(x)));
  if(f.tools.length)list=list.filter(c=>ITEMS.some(i=>i.creator===c.id&&i.tools.some(t=>f.tools.includes(t))));
  if(loc)list=list.filter(c=>c.loc.toLowerCase().includes(loc));
  if(f.hire)list=list.filter(c=>c.hire);
  const score=c=>c.cats.filter(x=>f.cats.includes(x)).length*1e6+c.followers;
  const recent=c=>Math.min(...ITEMS.filter(i=>i.creator===c.id).map(i=>i.days),999);
  return list.sort((a,b)=>f.sort==='followers'?b.followers-a.followers:f.sort==='recent'?recent(a)-recent(b):score(b)-score(a));
}
function talentRowHTML(c){
  const its=ITEMS.filter(i=>i.creator===c.id).slice(0,4);const tools=[...new Set(ITEMS.filter(i=>i.creator===c.id).flatMap(i=>i.tools))].slice(0,3);const sl=S.shortlist.has(c.id);
  return `<div class="trow2">${avHTML(c,'s56')}<div><b data-act="creator" data-creator="${c.id}" style="cursor:pointer">${esc(c.name)}</b> <span class="muted" style="font-size:12.5px">· ${fmt(c.followers)} followers</span><div class="muted" style="font-size:13px">${esc(c.role)} · ${esc(c.loc)}</div>
   <div class="ctx">${c.hire?'<span class="hire"><i></i>Available</span>':''}${c.cats.map(x=>`<span class="chip sm">${esc(x)}</span>`).join('')}${tools.map(t=>`<span class="chip sm" style="background:none;border:1px solid var(--line2)">${esc(t)}</span>`).join('')}</div></div>
   <div class="acts" style="display:flex;gap:8px"><button class="ibtn ${sl?'on':''}" data-act="shortlist" data-creator="${c.id}" title="${sl?'Remove from shortlist':'Add to shortlist'}">${ic('bookmark',16)}</button><button class="btn sm primary" data-act="talent-msg" data-creator="${c.id}">${ic('chat',14)} Message</button></div>
   <div class="th4">${its.map(i=>`<div class="ph t${i.tone}" data-act="open" data-id="${i.id}" title="${esc(i.title)}"></div>`).join('')}</div></div>`;
}
function renderTalentRes(){
  const el=$('#tres');if(!el)return;const list=talentPool();
  $('#tcount')&&($('#tcount').textContent=`${list.length} creator${list.length===1?'':'s'}`);
  $$('[data-act="talent-tab"]').forEach(b=>{b.classList.toggle('on',b.dataset.v===S.talent.tab);if(b.dataset.v==='short')b.textContent=`Shortlist · ${S.shortlist.size}`;});
  el.innerHTML=list.length?list.map(talentRowHTML).join(''):emptyHTML('users',S.talent.tab==='short'?'Your shortlist is empty':'No creators match','Bookmark creators to compare them here, or loosen your filters.');
}
function viewTalent(){
  if(!S.studio){
    const fake=CREATORS.filter(c=>c.id!=='me'&&!c.studio).slice(0,3).map(talentRowHTML).join('');
    V.innerHTML=`<div class="wrap"><div class="vh"><div class="grow"><div class="label">Studio plan</div><h1>Talent search</h1><p>Search every creator on the platform by discipline, tools, location and availability.</p></div></div>
    <div class="bgrid" style="margin-top:20px"><div class="locked"><div class="blur tlist">${fake}</div><div class="lock">${ic('lock',22)}<b>Unlock talent search</b><span class="muted" style="font-size:13px">Filters, shortlists and direct messages</span><button class="btn primary" data-act="studio-trial">Start 7-day free trial</button></div></div>
    <div class="box" style="align-self:start"><h4>Studio plan</h4><div><b style="font-size:30px;letter-spacing:-.02em">$49</b> <span class="muted">/ seat / month</span></div>
     <div style="margin:12px 0">${[['search','Search by discipline, tools, location and availability'],['bookmark','Shortlist and compare creators'],['chat','25 direct messages a month to people who don’t follow you'],['briefcase','1 featured job credit each month']].map(([i,t])=>`<div class="perk"><span class="pi">${ic(i,15)}</span><span>${t}</span></div>`).join('')}</div>
     <button class="btn primary block" data-act="studio-trial">Start 7-day free trial</button><p class="muted" style="font-size:12px;margin:8px 0 0;text-align:center">Then $49 / month. Cancel anytime in Billing.</p></div></div></div>`;
    return;
  }
  const f=S.talent;
  V.innerHTML=`<div class="wrap"><div class="vh"><div class="grow"><div class="label">Studio plan</div><h1>Talent search</h1><p>Find creators by skill, tools and availability.</p></div><span class="spill trial"><i></i>${S.studio==='trial'?'Free trial · 7 days left':'Active'}</span><span class="chip" id="tcred">${S.credits} message credits</span></div>
   <div class="tgrid"><aside class="tfil">
     <div><div class="label" style="margin-bottom:8px">Discipline</div><div class="ctx">${CATS.map(c=>`<button class="chip sm ${f.cats.includes(c)?'on':''}" data-act="talent-cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>
     <div><div class="label" style="margin-bottom:8px">Tools</div><div class="ctx">${ALLTOOLS.map(t=>`<button class="chip sm ${f.tools.includes(t)?'on':''}" data-act="talent-tool" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>
     <label class="field" style="margin:0"><span>Location</span><input type="text" id="tloc" placeholder="City or country" value="${esc(f.loc)}"></label>
     <div class="srow" style="padding:0;border:0"><div class="tx"><b>Available for hire</b><span>Only open to work</span></div><button class="switch ${f.hire?'on':''}" id="thire" role="switch" aria-label="Available for hire only"></button></div>
     <button class="lnk muted" style="align-self:flex-start;font-weight:500" data-act="talent-reset">Reset filters</button>
   </aside><div>
     <div class="fbar" style="position:static;margin-bottom:12px"><div class="tabs"><button class="${f.tab==='all'?'on':''}" data-act="talent-tab" data-v="all">All creators</button><button class="${f.tab==='short'?'on':''}" data-act="talent-tab" data-v="short">Shortlist · ${S.shortlist.size}</button></div><span class="muted" style="font-size:12px" id="tcount"></span><select id="tsort" style="width:auto;padding:8px 10px">${[['match','Best match'],['followers','Most followed'],['recent','Recently active']].map(([k,lb])=>`<option value="${k}" ${f.sort===k?'selected':''}>${lb}</option>`).join('')}</select></div>
     <div class="tlist" id="tres"></div></div></div></div>`;
  $('#tloc').oninput=e=>{f.loc=e.target.value;renderTalentRes();};
  $('#thire').onclick=e=>{f.hire=!f.hire;e.currentTarget.classList.toggle('on',f.hire);renderTalentRes();};
  $('#tsort').onchange=e=>{f.sort=e.target.value;renderTalentRes();};
  renderTalentRes();
}

/* ---------- click handling for everything above ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=b.dataset.id,cid=b.dataset.creator;
  switch(b.dataset.act){
    case 'boost':closePop();openBoost(id);break;
    case 'search-ad':openSearchAd(b.dataset.kw);break;
    case 'featured-buy':openFeatured();break;
    case 'sponsored-new':openSponsored();break;
    case 'sponsor-challenge':{const ch=$('.layer[data-kind="challenge"]');if(ch)closeModal(ch);openSponsorChallenge();break;}
    case 'post-job':openPostJob();break;
    case 'talent-go':go('talent');break;
    case 'pro':closePop();openPro();break;
    case 'tip':openTip(id);break;
    case 'ads-tab':S.adsTab=b.dataset.v;render(true);break;
    case 'camp-toggle':{const c=CAMPS.find(x=>x.id===id);setCampStatus(c,c.status==='active'?'paused':'active');toast(c.status==='paused'?`Paused <b>${esc(c.name)}</b>`:`Resumed <b>${esc(c.name)}</b>`);render(true);break;}
    case 'camp-stop':{const c=CAMPS.find(x=>x.id===id);if(await confirmBox('Stop this campaign?',`“${esc(c.name)}” stops now. Unspent budget (${money(Math.max(0,Math.round((c.budget-c.spent)*100)/100))}) is refunded to your card.`,'Stop campaign')){setCampStatus(c,'ended');c.budget=Math.round(c.spent*100)/100;render(true);toast('Campaign stopped. Refund on its way.');}break;}
    case 'camp-open':{const c=CAMPS.find(x=>x.id===id);if(c.itemId&&IT[c.itemId])openDetail(c.itemId);else if(c.type==='search'){const k=KWADS.find(a=>a.camp===c.id);if(k){sq.value=k.kws[0][0];doSearch(k.kws[0][0]);}}else if(c.type==='job')go('jobs');else if(c.type==='featured')go('home');else if(c.type==='challenge')openChallenge();else if(c.type==='sponsored'){toast('Sponsored posts show in matching feeds'+(isPro()?' (hidden for you on Pro)':''));}break;}
    case 'withdraw':{const net=TIPS_IN.reduce((s,x)=>s+x.amt*(1-x.fee),0);const bal=Math.round(Math.max(0,net-S.withdrawn)*100)/100;if(await confirmBox(`Withdraw ${money(bal)}?`,'It arrives in your bank •••• 1234 in 1–3 business days.','Withdraw',false)){S.withdrawn+=bal;render(true);toast(`Transfer of <b>${money(bal)}</b> started`);}break;}
    case 'card-update':openCardUpdate();break;
    case 'studio-trial':openCheckout({title:'Studio plan',lines:[['Studio plan · 1 seat',PRICE.talent]],credit:['7-day free trial',PRICE.talent],recurring:'month',zeroCta:'Start free trial',note:'You won’t be charged until Oct 17.',successTitle:'Your trial has started',successText:'Talent search is unlocked for 7 days.',onPaid:()=>{S.studio='trial';if(route().name==='talent')render(true);}});break;
    case 'studio-cancel':if(await confirmBox('Cancel the Studio plan?','Talent search, shortlists and message credits will stop working.','Cancel plan')){S.studio=false;render(true);toast('Studio plan cancelled');}break;
    case 'ad-why':e.stopPropagation();showWhy(b,b.dataset.kind,b.dataset.ad);break;
    case 'ad-hide':{const k=b.dataset.ad;S.hiddenAds.add(k);b.closest('.tko')?.remove();toast('Sponsor banner hidden',{action:'Undo',fn:()=>{S.hiddenAds.delete(k);render(true);}});break;}
    case 'sp-open':{const s=SPMAP[b.dataset.ad];if(!s)break;const br=s.brandObj||BRANDS[s.brand];openLeave(br.name,br.url,brandAv(br,'s56'));break;}
    case 'brand-open':{const br=BRANDS[b.dataset.brand];if(br)openLeave(br.name,br.url,brandAv(br,'s56'));break;}
    case 'kad-open':{e.preventDefault();const a=KWADS.find(x=>x.id===b.dataset.ad);if(!a)break;closeSearch();const v=advInfo(a);
      if(v.creator){if(v.creator.id==='me')go('profile/me');else if(/hire|contact/i.test(a.cta)){openMessages(v.creator.id);setTimeout(()=>{const i=$('#min');if(i){i.value=`Hi ${v.creator.name}! Found you through search. I have a project in mind.`;i.focus();}},50);}else{S.ptab='work';go('profile/'+v.creator.id);}}
      else openLeave(v.name,v.url||v.name,v.av);break;}
    case 'jad-open':{S.jobf='All';S.jobHl=id;go('jobs');break;}
    case 'talent-cat':chipToggle(S.talent.cats,b.dataset.v);b.classList.toggle('on');renderTalentRes();break;
    case 'talent-tool':chipToggle(S.talent.tools,b.dataset.v);b.classList.toggle('on');renderTalentRes();break;
    case 'talent-tab':S.talent.tab=b.dataset.v;renderTalentRes();break;
    case 'talent-reset':S.talent={cats:[],tools:[],loc:'',hire:true,sort:'match',tab:S.talent.tab};render(true);break;
    case 'shortlist':{const on=!S.shortlist.has(cid);on?S.shortlist.add(cid):S.shortlist.delete(cid);b.classList.toggle('on',on);toast(on?`Added <b>${esc(CR[cid].name)}</b> to your shortlist`:'Removed from shortlist');renderTalentRes();break;}
    case 'talent-msg':{const has=CONVOS.some(v=>v.with===cid&&v.msgs.length);if(!has){if(S.credits<=0){toast('You’re out of message credits this month');break;}S.credits--;const cr=$('#tcred');if(cr)cr.textContent=`${S.credits} message credits`;toast(`1 credit used · ${S.credits} left`);}openMessages(cid);break;}
  }
});

/* =========================================================
   Boot
   ========================================================= */
hydrate();renderMe();renderRailColls();applyPinned();updateBadges();
if(!location.hash)history.replaceState(null,'','#/home');
render();
if(!store.get('hinted',false)){setTimeout(()=>toast('Prototype: everything is clickable. Hover a card, press <b>/</b> to search, or hit <b>Upload</b>.',{ms:6000}),900);store.set('hinted',true);}
matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change',schedulePlay);
</script>
